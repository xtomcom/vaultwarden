name: Release

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version to package (e.g. 1.37.4). Empty = latest upstream release"
        required: false
        type: string
      force:
        description: "Repackage and overwrite assets even if the release already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: dani-garcia/vaultwarden
  IMAGE: ghcr.io/dani-garcia/vaultwarden

jobs:
  check:
    name: Check upstream release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # keep the scheduled workflow from being auto-disabled
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      gnu_digest: ${{ steps.resolve.outputs.gnu_digest }}
      musl_digest: ${{ steps.resolve.outputs.musl_digest }}
    steps:
      - name: Keep scheduled workflow enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/enable" || true

      - name: Resolve version and image digests
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'

          # releases/latest never returns drafts or pre-releases
          gh_version="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          # Anonymous pull token is enough to list tags of the public package
          repo="${IMAGE#ghcr.io/}"
          token="$(curl -fsSL "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)"
          ghcr_version="$(curl -fsSL -H "Authorization: Bearer ${token}" "https://ghcr.io/v2/${repo}/tags/list?n=10000" \
            | jq -r '.tags[]' | grep -E "${semver}" | sort -V | tail -n1 || true)"
          echo "GitHub latest release: ${gh_version}"
          echo "ghcr.io latest tag:    ${ghcr_version:-<none>}"

          version="${INPUT_VERSION:-${gh_version}}"
          if ! [[ "${version}" =~ ${semver} ]]; then
            echo "::error::Unexpected upstream version: ${version}"
            exit 1
          fi

          build=true
          if gh release view "${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [ "${INPUT_FORCE:-false}" = "true" ]; then
              echo "Release ${version} exists, repackaging (force)"
            else
              echo "Release ${version} already exists, nothing to do"
              build=false
            fi
          fi

          # Images are pushed some time after the GitHub release; wait for the next run if missing
          gnu_digest="" musl_digest=""
          if [ "${build}" = "true" ]; then
            for kind in gnu musl; do
              tag="${version}"
              [ "${kind}" = "musl" ] && tag="${version}-alpine"
              if ! manifest="$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' 2>/dev/null)"; then
                echo "::notice::${IMAGE}:${tag} is not published yet, skipping this run"
                build=false
                break
              fi
              for platform in linux/amd64 linux/arm64; do
                if ! jq -e --arg p "${platform}" \
                    'any(.manifests[].platform; "\(.os)/\(.architecture)" == $p)' <<<"${manifest}" >/dev/null; then
                  echo "::notice::${IMAGE}:${tag} has no ${platform} image yet, skipping this run"
                  build=false
                  break 2
                fi
              done
              digest="$(jq -r .digest <<<"${manifest}")"
              echo "${IMAGE}:${tag} -> ${digest}"
              declare "${kind}_digest=${digest}"
            done
          fi

          {
            echo "version=${version}"
            echo "build=${build}"
            echo "gnu_digest=${gnu_digest}"
            echo "musl_digest=${musl_digest}"
          } >> "${GITHUB_OUTPUT}"

  extract:
    name: Extract ${{ matrix.arch }}-${{ matrix.libc }}
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
        libc: [gnu, musl]
    # Native runner per arch so the binary can be smoke-tested inside its own image
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Extract binary and web-vault
        env:
          ARCH: ${{ matrix.arch }}
          LIBC: ${{ matrix.libc }}
          VERSION: ${{ needs.check.outputs.version }}
          DIGEST: ${{ matrix.libc == 'gnu' && needs.check.outputs.gnu_digest || needs.check.outputs.musl_digest }}
        run: |
          set -euo pipefail
          # Pinned by digest so every job extracts exactly the same image
          image="${IMAGE}@${DIGEST}"
          docker pull --platform "linux/${ARCH}" "${image}"
          cid="$(docker create --platform "linux/${ARCH}" "${image}")"
          mkdir -p out
          docker cp "${cid}:/vaultwarden" out/vaultwarden
          docker cp "${cid}:/web-vault" out/web-vault
          docker rm "${cid}"

          file out/vaultwarden
          reported="$(docker run --rm --platform "linux/${ARCH}" --entrypoint /vaultwarden "${image}" --version | head -n1)"
          echo "${reported}"
          if [ "${reported}" != "Vaultwarden ${VERSION}" ]; then
            echo "::error::Image reports '${reported}', expected 'Vaultwarden ${VERSION}'"
            exit 1
          fi
          if [ "${LIBC}" = "musl" ] && ! file out/vaultwarden | grep -qE 'static(-pie)? linked|statically linked'; then
            echo "::error::musl binary is not statically linked"
            exit 1
          fi
          test -f out/web-vault/index.html
          tar -C out -czf web-vault.tar.gz web-vault

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.arch }}-${{ matrix.libc }}
          path: out/vaultwarden
          if-no-files-found: error
          retention-days: 7

      # The web-vault is architecture independent; keep one copy
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'amd64' && matrix.libc == 'gnu'
        with:
          name: web-vault
          path: web-vault.tar.gz
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package
    needs: [check, extract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install nfpm
        run: |
          npm install --global @goreleaser/nfpm
          nfpm --version

      - uses: actions/download-artifact@v8
        with:
          path: input

      - name: Fetch upstream license
        run: curl -fsSL -o input/LICENSE.txt "https://raw.githubusercontent.com/${UPSTREAM_REPO}/refs/heads/main/LICENSE.txt"

      - name: Build archives and packages
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mv input/web-vault/web-vault.tar.gz input/web-vault.tar.gz
          ./packaging/package.sh "${VERSION}" input dist
          ls -l dist
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [check, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Attestations on private repositories require GitHub Enterprise Cloud
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

      - uses: actions/checkout@v7
        with:
          path: repo

      # Commit release.json first so the release tag points at a commit that records it
      - name: Record release in repository
        id: record
        working-directory: repo
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GNU_DIGEST: ${{ needs.check.outputs.gnu_digest }}
          MUSL_DIGEST: ${{ needs.check.outputs.musl_digest }}
        run: |
          set -euo pipefail
          current="$(jq -r '.version // "0"' release.json 2>/dev/null || echo 0)"
          # Backfilling an older version must not move release.json backwards
          if [ "$(printf '%s\n%s\n' "${current}" "${VERSION}" | sort -V | tail -n1)" != "${VERSION}" ]; then
            echo "release.json already records ${current}, leaving it unchanged"
            echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          jq -n \
            --arg version "${VERSION}" \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg release "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION}" \
            --arg upstream "https://github.com/${UPSTREAM_REPO}/releases/tag/${VERSION}" \
            --arg gnu "${IMAGE}:${VERSION}@${GNU_DIGEST}" \
            --arg musl "${IMAGE}:${VERSION}-alpine@${MUSL_DIGEST}" \
            '{version: $version, updated_at: $updated_at, release: $release, upstream: $upstream, images: {gnu: $gnu, musl: $musl}}' \
            > release.json
          cat release.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.json
          git commit -m "Release vaultwarden ${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          GNU_DIGEST: ${{ needs.check.outputs.gnu_digest }}
          MUSL_DIGEST: ${{ needs.check.outputs.musl_digest }}
          TARGET_SHA: ${{ steps.record.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            notes="$(cat <<EOF
          Binaries of [Vaultwarden ${VERSION}](https://github.com/${UPSTREAM_REPO}/releases/tag/${VERSION}), extracted unchanged from the official Docker images.

          | File | Source image | Runs on |
          |---|---|---|
          | \`vaultwarden-${VERSION}-linux-{amd64,arm64}-gnu.tar.gz\` | \`${IMAGE}:${VERSION}\` (Debian) | glibc >= 2.39 (Ubuntu 24.04+ / Debian 13+), needs libssl3, libpq5, libmariadb3 |
          | \`vaultwarden-${VERSION}-linux-{amd64,arm64}-musl.tar.gz\` | \`${IMAGE}:${VERSION}-alpine\` | Any Linux (static) |
          | \`vaultwarden_${VERSION}-1_{amd64,arm64}.deb\` | \`${IMAGE}:${VERSION}-alpine\` | Debian / Ubuntu, includes web-vault + systemd unit |
          | \`vaultwarden-${VERSION}-1.{x86_64,aarch64}.rpm\` | \`${IMAGE}:${VERSION}-alpine\` | RHEL / Alma / Rocky / Fedora / openSUSE, includes web-vault + systemd unit |

          Image digests:
          - \`${IMAGE}:${VERSION}\` \`${GNU_DIGEST}\`
          - \`${IMAGE}:${VERSION}-alpine\` \`${MUSL_DIGEST}\`

          Verify with \`sha256sum -c SHA256SUMS\` or \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`.
          EOF
          )"
            gh release create "${VERSION}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${TARGET_SHA}" \
              --title "Vaultwarden ${VERSION}" \
              --notes "${notes}"
          fi
